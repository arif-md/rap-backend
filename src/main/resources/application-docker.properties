# ============================================================================
# Docker Compose Profile Configuration
# ============================================================================
# This file is loaded when running with SPRING_PROFILES_ACTIVE=docker
# Used by: docker-compose.yml backend service
# 
# Key difference from local profile:
# - Backend runs inside a Docker container
# - Browser endpoints use localhost (user's browser)
# - Server-to-server endpoints use host.docker.internal (container networking)
# 
# See: docs/CONFIGURATION-MANAGEMENT.md for complete configuration guide
# ============================================================================

# ===========================================================================
# OIDC Provider: External Users (Login.gov / Keycloak)
# ===========================================================================
# Docker Compose passes env vars: OIDC_AUTHORIZATION_ENDPOINT, OIDC_TOKEN_ENDPOINT, etc.
# Variable names match .env file and application.properties (_ENDPOINT suffix)
# Defaults: Keycloak with mixed hostname strategy:
#   Browser-facing endpoints: localhost:9090
#   Backend-facing endpoints: host.docker.internal:9090
# When .env points to Login.gov, all endpoints use the same external URL.
# ===========================================================================
spring.security.oauth2.client.provider.oidc-provider.authorization-uri=${OIDC_AUTHORIZATION_ENDPOINT:http://localhost:9090/realms/raptor/protocol/openid-connect/auth}
spring.security.oauth2.client.provider.oidc-provider.token-uri=${OIDC_TOKEN_ENDPOINT:http://host.docker.internal:9090/realms/raptor/protocol/openid-connect/token}
spring.security.oauth2.client.provider.oidc-provider.user-info-uri=${OIDC_USER_INFO_ENDPOINT:http://host.docker.internal:9090/realms/raptor/protocol/openid-connect/userinfo}
spring.security.oauth2.client.provider.oidc-provider.jwk-set-uri=${OIDC_JWK_SET_URI:http://host.docker.internal:9090/realms/raptor/protocol/openid-connect/certs}
spring.security.oauth2.client.provider.oidc-provider.end-session-endpoint=${OIDC_END_SESSION_ENDPOINT:http://localhost:9090/realms/raptor/protocol/openid-connect/logout}
spring.security.oauth2.client.provider.oidc-provider.user-name-attribute=preferred_username

spring.security.oauth2.client.registration.oidc-provider.provider=oidc-provider
spring.security.oauth2.client.registration.oidc-provider.client-id=${OIDC_CLIENT_ID:raptor-client}
spring.security.oauth2.client.registration.oidc-provider.client-authentication-method=none
spring.security.oauth2.client.registration.oidc-provider.scope=openid,profile,email
spring.security.oauth2.client.registration.oidc-provider.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.oidc-provider.client-name=Raptor OIDC Provider
spring.security.oauth2.client.registration.oidc-provider.authorization-grant-type=authorization_code

# ===========================================================================
# Azure AD / Internal User Login
# ===========================================================================
# Azure AD properties are in application.properties (shared across profiles).
# Endpoints are derived from AZURE_AD_TENANT_ID; only tenantId, clientId,
# and clientSecret are passed from Docker Compose.
# ===========================================================================

# ===========================================================================
# Flyway — relaxed validation for local Docker development
# ===========================================================================
# In local Docker, migration files are sometimes edited during development
# (schema iteration). Disabling checksum validation prevents the backend
# container from crashing with "Migration checksum mismatch" after a file edit.
#
# RULE: Never modify a migration that has been applied to ANY environment other
# than your local Docker DB. If you need a schema change, create a new V<n+1>
# migration file. This setting is a local safety valve only.
#
# Azure profiles (dev, test, prod, azure) inherit validate-on-migrate=true from
# application.properties and will catch checksum mismatches before deployment.
# ===========================================================================
spring.flyway.validate-on-migrate=false
